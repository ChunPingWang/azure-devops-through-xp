# PointWallet CI/CD：XP 的「持續整合」與「小版本發佈」
# - 每次 push 到 main 就建置與測試（Continuous Integration）
# - 測試通過後自動部署到 staging 環境（Small Releases）
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: 建置與測試
    jobs:
      - job: Test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: 安裝 Node.js 22

          - script: npm run test:ci
            displayName: 執行單元測試（TDD）

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml
              testRunTitle: PointWallet Unit Tests
            displayName: 發佈測試結果

  - stage: DeployStaging
    displayName: 部署到 Staging
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "部署 PointWallet 到 staging（教材示範，請換成實際部署指令）"
                  displayName: 部署
